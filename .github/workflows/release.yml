name: Build & Release (Windows + Linux)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build PulseGlass (Portable)
        run: cargo build --release --bin PulseGlass
      - name: Build PulseGlass-Setup (Standalone Installer)
        run: cargo build --release --bin PulseGlass-Setup --features embed-app
      - name: Run unit tests
        run: cargo test --bin PulseGlass
      - uses: actions/upload-artifact@v4
        with:
          name: pulseglass-windows-x64
          path: |
            target/release/PulseGlass.exe
            target/release/PulseGlass-Setup.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI/OpenGL dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev libgtk-3-dev
      - name: Build PulseGlass (Linux x86_64)
        run: cargo build --release --bin PulseGlass
      - name: Run unit tests
        run: cargo test --bin PulseGlass
      - name: Stage Linux binary
        run: cp target/release/PulseGlass target/release/pulseglass-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: pulseglass-linux-x86_64
          path: target/release/pulseglass-linux-x86_64

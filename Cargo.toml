[package]
name = "pulseglass"
version = "2.1.0"
edition = "2021"
authors = ["yafermys", "misutesu-desu"]
description = "Lightweight glassmorphic hardware monitor, OSD overlay strip, and system utility for Windows & Linux"
license = "MIT"
repository = "https://github.com/yafermys/PulseGlass"

[features]
default = []
no-admin-manifest = []
embed-app = []

[[bin]]
name = "PulseGlass"
path = "src/main.rs"

[[bin]]
name = "PulseGlass-Setup"
path = "src/setup_main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
sysinfo = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
global-hotkey = "0.6"

[target.'cfg(windows)'.dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[build-dependencies]
embed-manifest = "1.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
